<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Powtórka z historii</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1EFFA;
  --ink:#1D2347;
  --muted:#5A6085;
  --line:#DEDAF0;
  --paper:#F8F7FD;
  --sand:#FFB938;
  --night:#1D2350;
  --good:#16A063;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:160px}
body{
  margin:0;color:var(--ink);background-color:var(--bg);
  background-image:radial-gradient(rgba(29,35,71,.07) 1px,transparent 1.3px);background-size:22px 22px;
  font-family:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Baloo 2','Lexend',system-ui,sans-serif;letter-spacing:-.005em}
b,strong{font-weight:700}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7C5CFF;outline-offset:2px;border-radius:10px}
.wrap{max-width:940px;margin:0 auto;padding:0 18px}
.hide{display:none!important}

/* ---------- HERO: nocne niebo ---------- */
.hero{position:relative;overflow:hidden;color:#fff;padding-top:30px;
  background:linear-gradient(160deg,#1D2350 0%,#2E2A66 58%,#45306E 100%)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:
  radial-gradient(1.6px 1.6px at 7% 24%,#fff 50%,transparent 52%),
  radial-gradient(1.2px 1.2px at 17% 72%,#FFE3A3 50%,transparent 52%),
  radial-gradient(2px 2px at 29% 13%,#fff 50%,transparent 52%),
  radial-gradient(1.2px 1.2px at 44% 58%,#fff 50%,transparent 52%),
  radial-gradient(1.8px 1.8px at 55% 20%,#FFE3A3 50%,transparent 52%),
  radial-gradient(1.2px 1.2px at 63% 80%,#fff 50%,transparent 52%),
  radial-gradient(1.5px 1.5px at 79% 9%,#fff 50%,transparent 52%),
  radial-gradient(1.2px 1.2px at 90% 66%,#FFE3A3 50%,transparent 52%);opacity:.85}
.hero-inner{position:relative;display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap}
.hero-text{flex:1 1 360px}
.hero .sub{margin:0;color:#FFD27A;font-weight:600;font-size:15px}
.hero h1{font-size:clamp(46px,8vw,76px);line-height:.95;margin:8px 0 12px;font-weight:800;color:#FFF6E3}
.hero .lead{margin:0;max-width:430px;color:#DCDFF4;font-size:16.5px}
/* ---------- STAŁE MENU NA GÓRZE ---------- */
.topmenu{position:sticky;top:0;z-index:60;background:#1D2350;border-bottom:2px solid #34306B;padding:8px 0 0}
.tm-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 18px 8px}
.tm-row::-webkit-scrollbar{display:none}
.tm-sub{border:0;cursor:pointer;white-space:nowrap;font-weight:700;font-size:15px;padding:10px 18px;border-radius:14px;background:rgba(255,255,255,.1);color:#CDD1F0}
.tm-sub:hover{background:rgba(255,255,255,.18)}
.tm-sub.active{background:var(--sand);color:#1D2350}
#tm-dzialy{padding-bottom:10px}
#tm-dzialy:empty{display:none}
.tab{border:0;cursor:pointer;white-space:nowrap;font-weight:600;font-size:14px;padding:9px 15px;border-radius:12px;background:rgba(255,255,255,.1);color:#CDD1F0}
.tab .tnr{opacity:.65;margin-right:6px;font-weight:500}
.tab.active{background:var(--bg);color:var(--ink)}

/* ---------- W TRAKCIE PRAC ---------- */
.soon{background:#fff;border:2px solid var(--line);border-radius:26px;padding:34px 28px;margin:26px 0 6px;box-shadow:0 5px 0 var(--line);text-align:center}
.soon .soon-ico{font-size:54px}
.soon h2{margin:10px 0 6px;font-size:30px}
.soon p{margin:0;color:var(--muted);font-weight:600}

/* ---------- WYBÓR: klasy, podręczniki, rozdziały ---------- */
.pick{display:grid;gap:14px;margin:26px 0 6px}
.pick-btn{cursor:pointer;display:flex;align-items:center;gap:16px;background:#fff;border:2px solid var(--line);border-radius:22px;padding:16px 20px;box-shadow:0 5px 0 var(--line);font-weight:700;font-size:19px;text-align:left;width:100%;color:var(--ink)}
.pick-btn:hover{border-color:#C9C2E6}
.pick-btn .pk-ico{font-size:30px;flex-shrink:0}
.pick-btn small{display:block;font-weight:600;color:var(--muted);font-size:14px}
.pick-btn .go{margin-left:auto;color:var(--muted);flex-shrink:0}
.badge{font-size:12.5px;font-weight:700;background:#E2F6EB;color:#11774A;border-radius:99px;padding:3px 10px;white-space:nowrap}
.badge.soon-b{background:#FFF0D1;color:#935600}
.book-cover{width:84px;height:auto;border-radius:10px;box-shadow:0 6px 14px -6px rgba(0,0,0,.4);flex-shrink:0}
.back{cursor:pointer;background:none;border:0;color:var(--muted);font-weight:700;font-size:14.5px;padding:0;margin:20px 0 0;text-decoration:underline}

/* ---------- FISZKI ---------- */
.pick-row{display:flex;gap:8px;align-items:stretch}
.pick-row .pick-btn{flex:1;min-width:0}
.fiszki-btn{cursor:pointer;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#fff;border:2px solid var(--line);border-radius:22px;padding:10px 14px;box-shadow:0 5px 0 var(--line);font-weight:700;font-size:22px;color:var(--ink)}
.fiszki-btn small{font-size:12px;color:var(--muted)}
.fiszki-btn:hover{border-color:#C9C2E6}
.fcard{background:#fff;border:2px solid var(--line);border-radius:22px;padding:20px 22px;box-shadow:0 5px 0 var(--line);margin:16px 0}
.f-q{font-weight:600;font-size:19px;line-height:1.45;margin:0}
.f-extra{display:block;font-weight:500;font-size:14.5px;color:var(--muted);margin-top:8px}
.f-a{margin-top:14px;background:#EAF8F0;border:2px solid #BEE8D1;border-radius:16px;padding:12px 16px}
.f-prog{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;color:var(--muted);margin-top:14px}
.f-prog .bar{flex:1;margin-top:0}
.f-jump{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;color:var(--muted);margin-top:10px}
.f-range{flex:1;accent-color:var(--sand);height:28px;cursor:pointer;min-width:0}

/* ---------- INTRO DZIAŁU ---------- */
.intro{display:flex;gap:22px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:26px;padding:22px 24px;margin:26px 0 6px;box-shadow:0 5px 0 var(--line)}
.bignr{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:104px;line-height:.75;color:var(--sand);text-shadow:5px 5px 0 #FFE2A0;padding-top:10px}
.intro h2{margin:0;font-size:32px;line-height:1.1}
.intro .meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px;padding:0;list-style:none}
.intro .meta li{font-size:13.5px;font-weight:600;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.howto{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none;counter-reset:s}
.howto li{counter-increment:s;background:#FFF6E0;border:1px solid #F6DFA6;border-radius:99px;padding:5px 12px 5px 6px;font-size:14px;font-weight:600}
.howto li::before{content:counter(s);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;margin-right:7px}

/* ---------- PASEK POSTĘPU ---------- */
.status{position:sticky;top:0;z-index:30;background:rgba(241,239,250,.93);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 0 8px}
.srow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.prog{flex:1 1 250px}
.ptop{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600}
.rank{color:#5638D8}
.bar{height:12px;border-radius:99px;background:#E1DCF2;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#FFD36B,var(--sand) 60%,#F59E0B);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{cursor:pointer;border:2px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-weight:600;font-size:13.5px}
.tool:hover{border-color:#C9C2E6}
.tool[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chips{display:flex;gap:7px;overflow-x:auto;padding:9px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;text-decoration:none;color:var(--dark);background:var(--soft);font-weight:600;font-size:13px;padding:5px 11px;border-radius:99px;border:1.5px solid transparent}
.chip small{opacity:.75;margin-left:5px;font-size:12px}
.chip.done{background:var(--dark);color:#fff}

/* ---------- KATEGORIE ---------- */
.cat{margin:40px 0 8px}
.cat-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.cat-ico{flex-shrink:0;width:54px;height:54px;border-radius:17px;display:grid;place-items:center;font-size:27px;background:var(--soft);box-shadow:inset 0 -4px 0 rgba(0,0,0,.06)}
.cat-head h2{margin:0;font-size:27px;line-height:1.1}
.cat-head p{margin:2px 0 0;color:var(--muted);font-size:14.5px}
.cat-cnt{margin-left:auto;flex-shrink:0;font-weight:600;font-size:13px;color:var(--dark);background:var(--soft);padding:5px 11px;border-radius:99px}
.cards{display:grid;gap:18px}

/* ---------- KARTA PYTANIA ---------- */
.card{position:relative;background:#fff;border:2px solid var(--line);border-top:7px solid var(--c);border-radius:22px;padding:16px 22px 20px;box-shadow:0 5px 0 var(--soft)}
.ctop{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.qnr{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--dark);color:#fff;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:18px;padding-top:2px}
.qtype{font-size:13px;font-weight:600;color:var(--dark);background:var(--soft);padding:4px 10px;border-radius:99px}
.qmark{margin-left:auto;font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;display:none}
.card.is-ok{border-color:#A7E3C4;box-shadow:0 5px 0 #C9EFDA}
.card.is-ok .qmark{display:inline-block;background:#E2F6EB;color:#11774A}
.card.is-rep .qmark{display:inline-block;background:#FFF0D1;color:#935600}
.qtext{font-family:'Lexend',sans-serif;font-weight:600;font-size:18.5px;line-height:1.45;margin:8px 0 12px}
.qbody{margin-bottom:16px}
.btn{cursor:pointer;border:0;border-radius:14px;padding:11px 18px;font-weight:600;font-size:15.5px;box-shadow:0 4px 0 rgba(0,0,0,.22);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.btn-reveal{background:var(--dark);color:#fff}
.answer{display:grid;gap:12px;margin-top:16px}
.answer[hidden]{display:none}
.answer:not([hidden]){animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}
.abox{background:#EAF8F0;border:2px solid #BEE8D1;border-radius:16px;padding:12px 16px}
.xbox{background:#FFF6DD;border:2px dashed #F0C65C;border-radius:16px;padding:12px 16px}
.lbl{display:block;font-size:14px;font-weight:700;margin-bottom:4px}
.abox .lbl{color:#11774A}
.xbox .lbl{color:#935600}
.abox ul,.abox ol,.xbox ul{margin:4px 0 0;padding-left:20px}
.abox li,.xbox li{margin:3px 0}
.abox p,.xbox p{margin:0 0 6px}
.abox p:last-child,.xbox p:last-child{margin-bottom:0}
.score{font-weight:600;font-size:14.5px;padding:8px 12px;border-radius:12px;background:var(--paper);border:1px solid var(--line)}
.selfcheck{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:2px}
.selfcheck span{font-weight:600;color:var(--muted);font-size:14.5px}
.btn-ok{background:var(--good);color:#fff}
.btn-rep{background:#fff;color:var(--ink);border:2px solid #E6D3A8;box-shadow:0 4px 0 #E6D3A8;padding:9px 16px}
.btn-ok.on{box-shadow:0 0 0 3px #A7E3C4,0 4px 0 rgba(0,0,0,.22)}
.btn-rep.on{background:#FFF0D1}
.card.pulse{animation:pulse 1s ease 2}
@keyframes pulse{0%,100%{transform:none}50%{transform:scale(1.012);box-shadow:0 0 0 7px var(--soft)}}

/* elementy w treści pytań */
.dates{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.dates li{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:6px 13px;font-weight:600}
.hint{font-size:14px;color:var(--muted);margin:0 0 9px}

/* dopasowanie */
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol{list-style:none;margin:0;padding:0;display:grid;gap:8px;align-content:start}
.mcol li{display:flex;align-items:center;gap:10px;background:var(--paper);border:1.5px solid var(--line);border-radius:13px;padding:8px 10px;font-size:15px;line-height:1.35}
.ix{flex-shrink:0;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:14px}
.ix-n{background:var(--soft);color:var(--dark)}
.ix-l{background:var(--ink);color:#fff}
.mcol select{margin-left:auto;flex-shrink:0;font:inherit;font-weight:700;font-size:15px;border:2px solid #D8D2EC;border-radius:10px;padding:3px 6px;background:#fff;cursor:pointer}
li.right{background:#E3F6EC!important;border-color:#8ED6B1!important}
li.wrong{background:#FFECE9!important;border-color:#F2A398!important}

/* prawda / fałsz */
.pf{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pf li{display:flex;align-items:center;gap:12px;background:var(--paper);border:1.5px solid var(--line);border-radius:13px;padding:9px 12px}
.pf .t{flex:1}
.pfb{display:flex;gap:6px;flex-shrink:0}
.pfb button{cursor:pointer;width:42px;height:38px;border-radius:10px;border:2px solid #D8D2EC;background:#fff;font-weight:700}
.pfb button.sel[data-v="P"]{background:var(--good);border-color:var(--good);color:#fff}
.pfb button.sel[data-v="F"]{background:#EE5A47;border-color:#EE5A47;color:#fff}

/* sortowanie: paleolit czy neolit */
.sort{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.sort li{display:flex;align-items:center;gap:12px;background:var(--paper);border:1.5px solid var(--line);border-radius:13px;padding:9px 12px}
.sort .t{flex:1}
.sortb{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
.sortb button{cursor:pointer;border-radius:10px;border:2px solid #D8D2EC;background:#fff;font-weight:700;padding:8px 12px;font-size:14px}
.sortb button.sel{background:var(--ink);border-color:var(--ink);color:#fff}

/* kolejność */
.opool{display:flex;flex-wrap:wrap;gap:8px}
.ochip{cursor:pointer;border:2px solid var(--c);background:#fff;border-radius:12px;padding:7px 13px;font-weight:600;font-size:15px;box-shadow:0 3px 0 var(--soft)}
.ochip:disabled{opacity:.28;cursor:default;box-shadow:none}
.oseq{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;align-items:center;margin-top:10px;padding:8px;border:2px dashed #D8D2EC;border-radius:14px;background:var(--paper)}
.oseq:empty::before{content:"Klikaj po kolei, a pojawi się tutaj twoja kolejność";color:var(--muted);font-size:14px;padding:0 6px}
.oseq span{background:var(--dark);color:#fff;border-radius:10px;padding:6px 10px;font-weight:600;font-size:14.5px}
.oseq span em{font-style:normal;opacity:.7;margin-right:5px;font-size:12px}
.oclear{margin-top:6px;cursor:pointer;background:none;border:0;padding:4px 0;color:var(--muted);font-weight:600;font-size:13.5px;text-decoration:underline}

/* ---------- ŚCIĄGAWKA ---------- */
.cheat{margin:48px 0 18px;background:#fff;border:2px solid var(--line);border-radius:26px;box-shadow:0 5px 0 var(--line);overflow:hidden}
.cheat summary{cursor:pointer;list-style:none;padding:16px 22px;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:22px;display:flex;align-items:center;gap:10px}
.cheat summary::-webkit-details-marker{display:none}
.cheat summary::after{content:"+";margin-left:auto;font-size:26px;line-height:1;color:var(--muted)}
.cheat[open] summary::after{content:"–"}
.cheat-body{padding:0 22px 22px;display:grid;gap:16px}
.tl{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tl .seg{padding:12px 6px;text-align:center;font-weight:700;font-size:13.5px;line-height:1.2;border-radius:10px;color:#4A2C00}
.tl .seg small{display:block;font-weight:500;font-size:11.5px;margin-top:4px;opacity:.85}
.tl .era{text-align:center;font-weight:600;font-size:13px;color:var(--muted);border-top:3px solid #E5DDC6;padding-top:5px}
.tl .era.h{border-color:#F2A05A;color:#A4520E}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rule{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}
.rule h4{margin:0 0 4px;font-size:18px;font-weight:700}
.rule p{margin:0;font-size:14.5px}
.roman{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:13px}
.roman span{background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 0;text-align:center}
.roman b{color:#5638D8}

footer{color:var(--muted);font-size:13.5px;text-align:center;padding:6px 18px 44px}

/* ---------- POWIADOMIENIA I KONFETTI ---------- */
.tool .sm{display:none}
.toast{opacity:0;visibility:hidden}
.toast.show{opacity:1;visibility:visible}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140px);background:var(--ink);color:#fff;font-weight:600;padding:12px 18px;border-radius:14px;box-shadow:0 14px 30px -10px rgba(0,0,0,.5);z-index:100;transition:transform .35s cubic-bezier(.2,.9,.3,1.2),opacity .25s,visibility .35s;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}
.confetti{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;z-index:99;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),112vh,0) rotate(var(--rot))}}

@media (max-width:680px){
  body{font-size:16px}
  html{scroll-padding-top:150px}
  .status{padding:8px 0 6px}
  .srow{gap:8px}
  .tools{width:100%;flex-wrap:nowrap}
  .tool{flex:1;font-size:13px;padding:6px 8px;white-space:nowrap}
  .tool .lg{display:none}
  .tool .sm{display:inline}
  .match,.rules{grid-template-columns:1fr}
  .sort li{flex-direction:column;align-items:stretch}
  .sortb{width:100%}
  .sortb button{flex:1}
  .roman{grid-template-columns:repeat(4,1fr)}
  .tl{grid-template-columns:1fr}
  .tl .era{display:none}
  .intro{gap:14px;padding:18px}
  .intro h2{font-size:26px}
  .bignr{font-size:68px}
  .card{padding:14px 16px 18px}
  .qtext{font-size:17px}
  .cat-head h2{font-size:23px}
  .cat-cnt{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<nav class="topmenu" id="topmenu" aria-label="Przedmioty">
  <div class="tm-row" id="tm-subjects"></div>
  <div class="tm-row" id="tm-dzialy"></div>
</nav>

<header class="hero">
  <div class="wrap">
    <div class="hero-inner">
      <div class="hero-text">
        <p class="sub" id="hero-sub">Historia – pytania do powtórki</p>
        <h1 id="hero-h1">Powtórka z historii</h1>
        <p class="lead" id="hero-lead">Przeczytaj pytanie, odpowiedz na głos albo na kartce i dopiero wtedy zajrzyj do odpowiedzi. Uczciwie! 😉</p>
      </div>
    </div>
  </div>
</header>

<div class="status">
  <div class="wrap">
    <div class="srow">
      <div class="prog">
        <div class="ptop"><span id="pcount"></span><span class="rank" id="rank"></span></div>
        <div class="bar" id="bar" role="progressbar" aria-label="Pytania, które umiesz" aria-valuemin="0"><i id="barfill"></i></div>
      </div>
      <div class="tools">

      extra:'<p>W niektórych książkach spotkasz jeszcze jedną epokę: <b>współczesność</b>, czyli czasy najnowsze. Różni autorzy zaczynają ją od różnych dat w XX w., np. od 1918 r. albo od 1945 r. To kolejny dowód, że podział na epoki jest umowny!</p>' },
    { typ:'opis', q:'Skąd pochodzą nazwy epok prehistorycznych?',

      extra:'<p>Naukowcy nazywają je po grecku: <b>paleolit</b> (<i>palaios</i> – stary, <i>lithos</i> – kamień) i <b>neolit</b> (<i>neos</i> – nowy).</p><p>W paleolicie narzędzia robiono, odłupując kawałki kamienia. W neolicie ludzie nauczyli się je szlifować i gładzić, a do tego zaczęli uprawiać rośliny i hodować zwierzęta.</p>' },

    c:'#FF6B5B', soft:'#FFE7E2', dark:'#C4382A',
    pytania:[
    { typ:'opis', q:'Czym różnił się klimat Europy sprzed 40 tysięcy lat od dzisiejszego klimatu?',
      odp:'<p>Ok. 40 tysięcy lat temu na Ziemi trwał <b>okres ochłodzenia</b>:</p><ul><li>średnia temperatura lipca na południu Europy wynosiła tylko <b>+5°C</b>,</li><li>północną część Europy pokrywał <b>lądolód</b>, którego grubość dochodziła do <b>3 km</b>,</li><li>na południu ciągnęła się <b>tundra</b>: rosły tam tylko trawy, krzewy i pojedyncze drzewa, a <b>lasów nie było</b>.</li></ul><p>Dziś klimat Europy jest <b>dużo cieplejszy</b>: lądolodu nie ma, rosną lasy.</p>',
      extra:'<p>Dziś średnia temperatura lipca w Polsce to ok. 18–20°C, a na południu Europy, np. w Rzymie, ok. 25°C. Lądolód o grubości 3 km to tyle, co ponad 12 Pałaców Kultury i Nauki postawionych jeden na drugim!</p><p>W czasie tego zlodowacenia lądolód dotarł też na północ dzisiejszej Polski. Zostawił po sobie jeziora na pojezierzach i wielkie <b>głazy narzutowe</b> przywleczone ze Skandynawii.</p>' },
    { typ:'opis', q:'Dlaczego ludzie starszej epoki kamiennej prowadzili koczowniczy tryb życia?',
      odp:'<p>Bo w zimnym klimacie:</p><ul><li><b>nie mogli uprawiać ziemi</b>, ponieważ przez większą część roku była zmarznięta,</li><li><b>nie mogli budować drewnianych domów</b>, bo brakowało im budulca (lasy nie rosły).</li></ul><p>Dlatego zajmowali się <b>myślistwem i zbieractwem</b> i <b>wędrowali w poszukiwaniu żywności</b>, zamiast budować trwałe domy.</p>',
      extra:'<p>„Koczować” to przebywać gdzieś tylko na jakiś czas, bez stałego domu. Koczownicy żyli nie tylko w epoce kamiennej. W dziale 6 poznasz koczowniczych pasterzy z Bliskiego Wschodu, którzy wędrowali w poszukiwaniu pastwisk dla bydła.</p>' },
    { typ:'opis', q:'Gdzie i dlaczego ok. 10 tysięcy lat temu zmieniły się warunki życia ludzi?',
      odp:'<p><b>Gdzie:</b> najpierw na <b>Bliskim Wschodzie</b>, a potem w Europie.</p><p><b>Dlaczego:</b> bo zmienił się klimat. Już ok. 20 tysięcy lat temu zaczął się ocieplać: lądolód cofnął się na północ, zaczęły padać obfite deszcze, wyrosły gęste lasy, wysokie trawy i <b>dzikie zboża</b>. Ok. 10 tysięcy lat temu nastał <b>okres ciepły</b>, w którym żyjemy do dziś. Wtedy mieszkańcy Bliskiego Wschodu jako pierwsi w dziejach <b>zaczęli uprawiać ziemię i hodować zwierzęta</b>.</p>',
      extra:'<p>Obszar, na którym powstały pierwsze uprawy, nazywa się <b>Żyznym Półksiężycem</b>. To łukowaty pas urodzajnych ziem od Mezopotamii przez Syrię po Palestynę. Pierwszymi uprawianymi zbożami były pszenica i jęczmień.</p>' },
    { typ:'opis', q:'Z jakiego powodu mieszkańcy Bliskiego Wschodu zaczęli prowadzić osiadły tryb życia?',
      odp:'<p>Bo <b>zajęli się rolnictwem</b>. Uprawiali pola, a pól <b>trzeba było doglądać</b>, więc nie mogli już wędrować z miejsca na miejsce. Zamieszkali w <b>trwałych domach</b> z drewna albo z gliny zmieszanej z trzciną. W cieplejszym klimacie rosły już lasy, więc mieli z czego budować.</p>',
      extra:'<p>Zboże rośnie kilka miesięcy. Od siewu do żniw trzeba pilnować pola, np. przed dzikimi zwierzętami. A zebrane ziarno można przechowywać na później w glinianych naczyniach. Dlatego rolnicy zostawali w jednym miejscu.</p>' },
    { typ:'opis', q:'Które gałęzie rzemiosła rozwinęły się jako pierwsze – i dlaczego właśnie one?',
      odp:'<ul><li><b>Garncarstwo.</b> Ludziom nie wystarczały już naczynia ze skóry czy drewna, więc zaczęli wytwarzać <b>gliniane wazy, misy i dzbany</b>. Przechowywali w nich ziarno i napoje, a także gotowali posiłki.</li><li><b>Tkactwo.</b> W cieplejszym klimacie potrzebne były <b>bardziej przewiewne stroje z wełny i lnu</b> zamiast ubrań szytych ze skór.</li></ul>',
      extra:'<p>Z łodyg lnu robi się nici, a wełnę dawały udomowione owce, więc hodowla i tkactwo szły w parze.</p><p>Gliniane naczynia są dla archeologów tak ważne, że całe dawne społeczności nazywa się od wzorów na garnkach. Na ziemiach polskich żyli np. rolnicy z tzw. <b>kultury ceramiki wstęgowej rytej</b>.</p>' },
    { typ:'wymien', q:'Przedstaw skutki rewolucji neolitycznej.',
      odp:'<ol><li><b>Osiadły tryb życia</b> – ludzie nie wędrowali już, bo musieli doglądać pól. Budowali trwałe domy z drewna albo z gliny zmieszanej z trzciną.</li><li><b>Udoskonalenie kamiennych narzędzi</b> – ludzie nauczyli się je wygładzać, przewiercać i osadzać na trzonkach. Zaczęli też wytwarzać narzędzia rolnicze.</li><li><b>Udomowienie kóz, owiec, bydła i świń</b> – zwierzęta dawały mięso, skóry, mleko i wełnę.</li><li><b>Możliwość wyżywienia większej liczby ludzi dzięki rolnictwu</b> – na Bliskim Wschodzie przybywało ludzi, powstawały coraz ludniejsze wsie i osady.</li><li><b>Powstanie pierwszych gałęzi rzemiosła</b>: garncarstwa i tkactwa.</li></ol>',
      extra:'<p>Skutki rewolucji neolitycznej odczuwamy do dziś. Chleb, mleko, wełniany sweter, gliniany kubek – to wszystko ma swój początek właśnie wtedy.</p>' },
    { typ:'opis', q:'Omów różnice między koczowniczym a osiadłym trybem życia.',
      odp:'<ul><li><b>Koczowniczy tryb życia</b> (paleolit): ludzie <b>wędrowali w poszukiwaniu żywności</b> i nie budowali trwałych domów. Mieszkali w <b>jaskiniach albo namiotach</b> z kości mamuta okrytych skórami. Żyli z <b>myślistwa i zbieractwa</b>.</li><li><b>Osiadły tryb życia</b> (neolit): ludzie <b>mieszkali na stałe w jednym miejscu</b>, bo musieli doglądać pól. Budowali <b>trwałe domy</b> z drewna lub gliny zmieszanej z trzciną. Żyli z <b>rolnictwa</b>, czyli uprawy ziemi i hodowli zwierząt. Powstawały coraz ludniejsze <b>wsie i osady</b>.</li></ul>',
      extra:'<p>Sposób na dobrą odpowiedź: porównuj po kolei te same rzeczy – gdzie ludzie mieszkali, z czego żyli, czy się przemieszczali.</p><p>Możesz dodać jeszcze jedną różnicę: koczownik wszystko, co miał, nosił ze sobą, więc nie mógł mieć ciężkich rzeczy. Rolnik mógł gromadzić zapasy w ciężkich glinianych naczyniach.</p>' }

      extra:'<p>Lądolody istnieją do dziś: pokrywają Antarktydę i Grenlandię. Tundra też: znajdziesz ją na dalekiej północy, np. w północnej Skandynawii i na Syberii, gdzie żyją renifery.</p><p>Do Bliskiego Wschodu należą m.in. Mezopotamia, Egipt i Palestyna. Poznasz je w kolejnych działach.</p>' },

  { id:'d6-slowa', ikona:'🗣️', nazwa:'Wyjaśnij własnymi słowami', krotko:'Słowami',

    c:'#FF6B5B', soft:'#FFE7E2', dark:'#C4382A',
    pytania:[
    { typ:'opis', q:'Czym jest Biblia?',
      odp:'<p>Biblia to <b>święta księga żydów i chrześcijan</b>. Wierzą oni, że powstała <b>pod natchnieniem Boga</b>, czyli że jej autorzy napisali to, co Stwórca chciał powiedzieć ludziom. Składa się z <b>kilkudziesięciu części nazywanych księgami</b> (np. Księga Rodzaju). Jest dziełem <b>religijnym, a nie naukowym</b>.</p>',
      extra:'<p>Słowo „Biblia” pochodzi z greki i znaczy po prostu „książki”, w liczbie mnogiej! Greckie słowo wiąże się z nazwą fenickiego miasta Byblos, przez które sprowadzano papirus, czyli materiał do pisania. Z tego samego źródła pochodzi słowo „biblioteka”.</p><p>Biblia to rzeczywiście cała biblioteka: Biblia katolicka liczy 73 księgi.</p>' },
    { typ:'opis', q:'Jakie są różnice między Biblią hebrajską a Biblią chrześcijańską?',
      odp:'<ul><li><b>Biblia hebrajska</b> (żydowska) była pisana prawdopodobnie <b>od XIII do II w. p.n.e.</b> Chrześcijanie nazywają ją <b>Starym Testamentem</b>.</li><li><b>Biblia chrześcijańska</b> obejmuje Stary Testament oraz <b>Nowy Testament</b>, który powstał <b>w I w. n.e.</b> i opowiada o życiu i nauce Jezusa Chrystusa.</li><li>Dla chrześcijan Nowy Testament jest częścią Biblii, a <b>dla żydów – nie</b>.</li></ul>',
      extra:'<p>Żydzi nazywają swoją Biblię <b>Tanach</b>. To skrót od nazw jej trzech części: <b>T</b>ora (Pouczenie), <b>N</b>ewiim (Prorocy) i <b>K</b>etuwim (Pisma). Biblię hebrajską spisano głównie po hebrajsku, a Nowy Testament – po grecku.</p><p>Policz: od XIII do II w. p.n.e. to ponad tysiąc lat spisywania ksiąg!</p>' },
    { typ:'opis', q:'Dlaczego historycy ostrożnie podchodzą do informacji zawartych w Biblii? Co odpowie historyk na pytanie, czy istniał Abraham?',
      odp:'<p>Bo Biblia jest dziełem <b>religijnym, a nie naukowym</b>. Jej autorzy opisali np. <b>rozmowy Abrahama z Bogiem</b>. Nauka nie zajmuje się takimi informacjami, bo są one <b>przedmiotem wiary</b>: albo ktoś w nie wierzy, albo nie. Jednocześnie księgi historyczne Biblii są znakomitym źródłem historycznym, więc historycy z nich korzystają, ale ostrożnie.</p><p>Na pytanie o Abrahama historyk odpowie: <b>na pewno istniało plemię, z którego powstał naród żydowski, i być może żył biblijny Abraham</b>. Pewności jednak nie mamy i prawdopodobnie nie będziemy mieli nigdy.</p>',
      extra:'<p>Historycy porównują opisy z Biblii z innymi źródłami, np. ze znaleziskami archeologów. W 1947 r. pasterz z plemienia Beduinów, szukając zagubionej kozy, natrafił w jaskiniach nad Morzem Martwym na gliniane dzbany ze starymi zwojami.</p><p>Te <b>zwoje znad Morza Martwego</b> mają ponad 2000 lat i należą do najstarszych znanych odpisów ksiąg Biblii hebrajskiej.</p>' },
    { typ:'opis', q:'Co nazywamy tzw. niewolą babilońską? Dlaczego mówimy „tak zwaną”?',
      odp:'<p>W początkach VI w. p.n.e. Babilończycy opanowali królestwo Judy. Gdy Żydzi zbuntowali się przeciwko ich rządom, Babilończycy <b>zdobyli Jerozolimę i zniszczyli świątynię (586 r. p.n.e.)</b>. Król Babilonii kazał <b>przesiedlić kilkanaście tysięcy Żydów na wschód</b>. Ten czas nazywamy tzw. <b>niewolą babilońską</b>.</p><p>Mówimy „tak zwaną”, bo Żydzi byli <b>przesiedleńcami, a nie niewolnikami</b>. Niektórzy zajmowali nawet wysokie stanowiska w państwie babilońskim.</p><p>Niewola skończyła się po kilkudziesięciu latach: w <b>539 r. p.n.e.</b> Persowie podbili Babilonię, a ich król pozwolił Żydom wrócić do Palestyny.</p>',
      extra:'<p>Królem Babilonii, który kazał zniszczyć świątynię jerozolimską, był <b>Nabuchodonozor II</b>. Za jego panowania zbudowano w Babilonie <b>Bramę Isztar</b>, ozdobioną niebieskimi glazurowanymi cegłami z wizerunkami zwierząt. Jej rekonstrukcja stoi dziś w muzeum w Berlinie.</p>' },
    { typ:'opis', q:'Czym różni się monoteizm od politeizmu? Co wyznawali Izraelici?',
      odp:'<ul><li><b>Monoteizm</b>, czyli jedynobóstwo, to wiara w <b>jednego Boga</b>.</li><li><b>Politeizm</b>, czyli wielobóstwo, to wiara w <b>wielu bogów</b>.</li></ul><p>Izraelici, w przeciwieństwie do innych starożytnych ludów, wierzyli w jednego Boga, <b>Jahwe</b>, czyli wyznawali <b>monoteizm</b>. Inne ludy starożytne, np. Sumerowie czy Egipcjanie, czciły wielu bogów.</p>',
      extra:'<p>Obie nazwy pochodzą z greki: <i>monos</i> – jeden, <i>polys</i> – wiele, <i>theos</i> – bóg.</p><p>Religie, które wywodzą się z judaizmu, czyli chrześcijaństwo i islam, też są monoteistyczne.</p>' },
    { typ:'opis', q:'Co mówi judaizm o Bogu i o narodzie wybranym?',
      odp:'<ul><li>Bóg jest jeden (<b>Jahwe</b>), <b>nie ma początku ani końca</b>, <b>stworzył świat i człowieka</b>.</li><li>Okazuje ludziom <b>miłosierdzie</b>, ale jest „<b>Bogiem zazdrosnym</b>”: człowiek ma Go kochać „z całego serca, z całej duszy, ze wszystkich sił”.</li><li>Izraelici są <b>narodem wybranym</b>, bo <b>za ich pośrednictwem Bóg da się poznać całemu światu</b>.</li></ul>',
      extra:'<p>Słowa o kochaniu Boga „z całego serca” są częścią modlitwy <b>Szema Israel</b> („Słuchaj, Izraelu”), jednej z najważniejszych modlitw w judaizmie.</p><p>Imię Boga zapisywano czterema literami (JHWH). Pobożni żydzi z szacunku go nie wymawiają i mówią zamiast niego np. „Adonaj”, czyli „Pan”.</p>' },
    { typ:'opis', q:'Omów dzieje narodu wybranego od czasów Abrahama do końca tzw. niewoli babilońskiej.',
      odp:'<ol><li>Według Biblii plemię koczowniczych pasterzy, którym przewodził <b>Abraham</b>, na polecenie Boga wyruszyło <b>z Mezopotamii do Ziemi Obiecanej</b> (Palestyny).</li><li>Potomkowie Abrahama dali początek <b>narodowi wybranemu</b> – Izraelitom, których później nazwano Żydami.</li><li><b>Na przełomie XI i X w. p.n.e.</b> Izraelici utworzyli w Palestynie <b>królestwo Izraela</b>. Do rozkwitu doprowadzili je królowie <b>Dawid</b> (ok. 1010 – ok. 970 p.n.e.) i jego syn <b>Salomon</b> (ok. 970 – ok. 931 p.n.e.), który zbudował świątynię w Jerozolimie.</li><li>Po śmierci Salomona królestwo <b>podzieliło się na dwa słabe i skłócone państwa</b>. Jednym z nich była <b>Juda</b> ze stolicą w Jerozolimie.</li><li>W początkach VI w. p.n.e. Judę opanowali <b>Babilończycy</b>. Po buncie Żydów zdobyli Jerozolimę i zniszczyli świątynię (<b>586 r. p.n.e.</b>), a kilkanaście tysięcy Żydów przesiedlono na wschód. Zaczęła się <b>tzw. niewola babilońska</b>.</li><li>W <b>539 r. p.n.e.</b> Persowie podbili Babilonię. Ich król <b>pozwolił Żydom wrócić do Palestyny</b>, która stała się częścią Persji. Żydzi odbudowali świątynię i wierzyli, że własne państwo przywróci im Mesjasz.</li></ol>',
      extra:'<p>Sposób na zapamiętanie: sześć słów-kluczy po kolei, czyli <b>wędrówka → naród → królestwo → podział → niewola → powrót</b>. Do każdego dopowiedz jedno zdanie, a w pracy pisemnej dodaj daty: ok. 1010, ok. 931, 586 i 539 p.n.e.</p>' }
    ]},

    pytania:[
    { typ:'pojecie', q:'Wyjaśnij pojęcia: Ziemia Obiecana, Palestyna, Izrael.',
      odp:'<ul><li><b>Ziemia Obiecana</b> – według Biblii kraj, do którego na polecenie Boga wyruszyło z Mezopotamii plemię Abrahama. Leżał tam, gdzie dziś znajduje się państwo Izrael.</li><li><b>Palestyna</b> – starożytna nazwa kraju potomków Abrahama.</li><li><b>Izrael</b> – druga starożytna nazwa tego kraju, od imienia jednego z wnuków Abrahama. Tak nazywało się też królestwo utworzone przez Izraelitów na przełomie XI i X w. p.n.e. Dziś to nazwa państwa.</li></ul>',
      extra:'<p>Tym wnukiem Abrahama był <b>Jakub</b>, syn Izaaka. Według Biblii otrzymał on od Boga imię Izrael.</p><p>Nazwa <b>Palestyna</b> pochodzi od <b>Filistynów</b>, ludu, który mieszkał na wybrzeżu. Filistynem był biblijny olbrzym Goliat, którego pokonał młody Dawid.</p>' },
    { typ:'pojecie', q:'Wyjaśnij pojęcia: judaizm, Dekalog, Tora.',
      odp:'<ul><li><b>Judaizm</b> – religia żydowska. Jest <b>monoteistyczna</b> i <b>istnieje do dziś</b>. Wywodzą się z niej chrześcijaństwo i islam.</li><li><b>Dekalog</b> – <b>dziesięcioro przykazań</b> zawartych w Biblii. Według Biblii otrzymał je Mojżesz od samego Boga, wyryte na kamiennych tablicach. Określa <b>główne zasady postępowania</b> wyznawców judaizmu.</li><li><b>Tora</b> – <b>pięć pierwszych ksiąg Biblii</b>. Zawiera liczne nakazy i zakazy uzupełniające Dekalog, a także opisy stworzenia świata i dzieje Abrahama oraz jego potomków. Dla wyznawców judaizmu to <b>najważniejsza część Biblii</b>.</li></ul>',
      extra:'<p>„Dekalog” to po grecku „dziesięć słów” (<i>deka</i> – dziesięć, <i>logos</i> – słowo). Według tradycji żydowskiej Tora zawiera aż <b>613 nakazów i zakazów</b>.</p><p>Zwój Tory przepisuje się ręcznie, piórem. Podczas czytania wodzi się po tekście wskaźnikiem w kształcie małej dłoni (nazywa się <b>jad</b>), żeby nie dotykać pergaminu palcami.</p>' },
    { typ:'pojecie', q:'Słowo „Żydzi” ma dwa znaczenia. Jakie? Kiedy piszemy je wielką, a kiedy małą literą?',
      odp:'<ol><li><b>żydzi</b> (małą literą) – <b>wyznawcy judaizmu</b>, tak jak chrześcijanie, muzułmanie czy wyznawcy innych religii.</li><li><b>Żydzi</b> (wielką literą) – <b>członkowie narodu żydowskiego</b>, tak jak np. Polacy. W przeszłości nazywano ich też <b>Izraelitami</b> lub <b>Hebrajczykami</b>.</li></ol>',
      extra:'<p>To ogólna zasada polskiej pisowni: nazwy narodów piszemy wielką literą (Polak, Żyd, Egipcjanin), a nazwy wyznawców religii małą (katolik, żyd, muzułmanin).</p><p>Język hebrajski jest używany do dziś. To urzędowy język państwa Izrael, a pisze się w nim od prawej do lewej.</p>' },

      extra:'<p>Na egipskim malowidle w podręczniku łatwo odróżnić obie grupy. Egipcjanie noszą proste białe spódniczki, a przybysze mają kolorowe, wzorzyste stroje i prowadzą ze sobą osły.</p><p>Koczownicy żyją do dziś, np. część Beduinów na pustyniach Bliskiego Wschodu.</p>' },
    { typ:'pojecie', q:'Wyjaśnij pojęcia: Mesjasz, synagoga.',
      odp:'<ul><li><b>Mesjasz</b> – według wierzeń Żydów <b>człowiek posłany przez Boga</b>. Po powrocie z niewoli babilońskiej Żydzi wierzyli, że Mesjasz <b>przywróci im własne państwo</b>.</li><li><b>Synagoga</b> – <b>żydowski dom modlitwy</b>. Każda synagoga ma ręcznie spisany zwój Tory.</li></ul>',
      extra:'<p>Hebrajskie słowo „mesjasz” znaczy „namaszczony”. Po grecku to samo słowo brzmi „Christos”, stąd tytuł Chrystus. Chrześcijanie wierzą, że Mesjaszem był Jezus, a wyznawcy judaizmu wciąż na Mesjasza czekają.</p><p>„Synagoga” to po grecku „zgromadzenie”.</p>' }

      extra:'<p>Według Biblii Dawid jako młody pasterz pokonał olbrzyma Goliata kamieniem wystrzelonym z procy.</p><p>Salomon słynął z mądrości. Stąd powiedzenie „<b>salomonowy wyrok</b>”, czyli mądry i sprawiedliwy, oraz przysłowie „<b>z pustego i Salomon nie naleje</b>”.</p>' },

      extra:'<p>Według Biblii Abraham pochodził z miasta <b>Ur</b> w Mezopotamii, jednego z miast Sumerów.</p><p>Na rycinie w podręczniku aniołowie zapowiadają, że Abraham i Sara mimo starości będą mieli syna. Był nim <b>Izaak</b>. Jego imię kojarzy się ze śmiechem, bo według Biblii Sara roześmiała się, słysząc tę zapowiedź.</p><p>Abraham jest ważną postacią dla trzech religii: judaizmu, chrześcijaństwa i islamu.</p>' },

/* ---------- budowanie HTML ---------- */
function matchHTML(p){
  var opts='<option value="">?</option>'+p.prawa.map(function(_,j){return '<option value="'+LIT[j]+'">'+LIT[j]+'</option>';}).join('');
  var L=p.lewa.map(function(t,i){return '<li><span class="ix ix-n">'+(i+1)+'</span><span>'+t+'</span><select aria-label="Litera dla pozycji '+(i+1)+'">'+opts+'</select></li>';}).join('');
  var R=p.prawa.map(function(t,j){return '<li><span class="ix ix-l">'+LIT[j]+'</span><span>'+t+'</span></li>';}).join('');
  return '<p class="hint">Przy każdym numerze wybierz literę albo zapisz pary na kartce, np. 1–B.</p><div class="match"><ol class="mcol ml">'+L+'</ol><ul class="mcol mr">'+R+'</ul></div>';
}
function matchAnswer(p){
  return '<ul>'+p.lewa.map(function(t,i){var j=LIT.indexOf(p.klucz[i]);return '<li><b>'+(i+1)+' – '+p.klucz[i]+'</b>: '+t+' → '+p.prawa[j]+'</li>';}).join('')+'</ul>';
}
function pfHTML(p){
  return '<p class="hint">Przy każdym zdaniu kliknij P (prawda) albo F (fałsz).</p><ol class="pf">'+p.zdania.map(function(z,i){
    var l=LIT[i].toLowerCase();
    return '<li><span class="t"><b>'+l+')</b> '+z.t+'</span><span class="pfb" role="group" aria-label="Zdanie '+l+'"><button type="button" data-v="P" aria-pressed="false">P</button><button type="button" data-v="F" aria-pressed="false">F</button></span></li>';
  }).join('')+'</ol>';
}
function pfAnswer(p){
  return '<ul>'+p.zdania.map(function(z,i){return '<li><b>'+LIT[i].toLowerCase()+') '+(z.p?'✅ Prawda':'❌ Fałsz')+'</b>'+(z.fix?': '+z.fix:'')+'</li>';}).join('')+'</ul>';
}
function sortHTML(p){
  var btns=p.kategorie.map(function(kat,ki){return '<button type="button" data-k="'+ki+'" aria-pressed="false">'+kat+'</button>';}).join('');
  var hint=p.hint||('Przy każdej cesze kliknij „'+p.kategorie.slice(0,-1).join('”, „')+'” albo „'+p.kategorie[p.kategorie.length-1]+'”.');
  return '<p class="hint">'+hint+'</p><ol class="sort">'+p.elementy.map(function(el,i){
    return '<li><span class="t">'+el.t+'</span><span class="sortb" role="group" aria-label="Cecha '+(i+1)+'">'+btns+'</span></li>';
  }).join('')+'</ol>';
}
function sortAnswer(p){
  return p.kategorie.map(function(kat,ki){
    var items=p.elementy.filter(function(el){return el.k===ki;});
    return '<p><b>'+kat+':</b></p><ul>'+items.map(function(el){return '<li>'+el.t+'</li>';}).join('')+'</ul>';
  }).join('');
}
function orderHTML(p){
  return '<p class="hint">'+(p.hint||'Klikaj daty od najdawniejszej do najpóźniejszej.')+'</p><div class="opool">'+p.elementy.map(function(t,i){return '<button type="button" class="ochip" data-i="'+i+'">'+t+'</button>';}).join('')+'</div><div class="oseq" aria-live="polite"></div><button type="button" class="oclear">Wyczyść i ułóż jeszcze raz</button>';
}
function bodyHTML(p){
  if(p.typ==='dopasuj')return matchHTML(p);
  if(p.typ==='pf')return pfHTML(p);
  if(p.typ==='sortuj')return sortHTML(p);
  if(p.typ==='kolejnosc')return orderHTML(p);
  return p.body||'';
}
function cardHTML(p){
  var ans=p.typ==='dopasuj'?matchAnswer(p):p.typ==='pf'?pfAnswer(p):p.typ==='sortuj'?sortAnswer(p):p.odp;
  var body=bodyHTML(p);
  return '<article class="card" id="q'+p.nr+'" data-uid="'+p.uid+'" style="'+vars(p.k)+'">'+
    '<div class="ctop"><span class="qnr">'+p.nr+'</span><span class="qtype">'+TYPY[p.typ]+'</span><span class="qmark"></span></div>'+
    '<h3 class="qtext">'+p.q+'</h3>'+
    (body?'<div class="qbody">'+body+'</div>':'')+
    '<button type="button" class="btn btn-reveal" aria-expanded="false" aria-controls="a'+p.nr+'">👀 Pokaż odpowiedź</button>'+
    '<div class="answer" id="a'+p.nr+'" hidden>'+
      '<div class="score hide"></div>'+
      '<div class="abox"><span class="lbl">✔ Odpowiedź</span>'+ans+'</div>'+
      (p.extra?'<div class="xbox"><span class="lbl">⭐ Zabłyśnij na lekcji</span>'+p.extra+'</div>':'')+
      '<div class="selfcheck"><span>Jak Ci poszło?</span><button type="button" class="btn btn-ok">✅ Umiem!</button><button type="button" class="btn btn-rep">🔁 Muszę powtórzyć</button></div>'+
    '</div></article>';
}
function catHTML(k){
  return '<section class="cat" id="k-'+k.id+'" style="'+vars(k)+'">'+
    '<div class="cat-head"><div class="cat-ico" aria-hidden="true">'+k.ikona+'</div><div><h2>'+k.nazwa+'</h2><p>'+k.opis+'</p></div><span class="cat-cnt" data-cnt="'+k.id+'"></span></div>'+
    '<div class="cards">'+k.pytania.map(cardHTML).join('')+'</div></section>';
}

/* ---------- FISZKI: dane z pytań rozdziału I ---------- */
function stripTags(h){var d=document.createElement('div');d.innerHTML=h||'';return ((d.textContent||'').replace(/\s+/g,' ').trim());}
function frontZ(p){
  var f=p.q,ex=[];
  if(p.typ==='kolejnosc')ex=p.elementy;
  else if(p.typ==='dopasuj')ex=p.lewa;
  else if(p.typ==='pf')ex=p.zdania.map(function(z){return z.t;});
  else if(p.typ==='sortuj')ex=p.elementy.map(function(e){return e.t;});
  else if(p.body)ex=[stripTags(p.body)];
  if(ex.length)f+='<span class="f-extra">'+ex.map(stripTags).join(' • ')+'</span>';
  return f;
}
function backZ(p){
  if(p.typ==='dopasuj')return matchAnswer(p);
  if(p.typ==='pf')return pfAnswer(p);
  if(p.typ==='sortuj')return sortAnswer(p);
  return p.odp;
}

DZIALY.forEach(function(d){var n=0;d.kategorie.forEach(function(k){k.pytania.forEach(function(p){n++;FISZKI.push({uid:d.id+'-'+n,dz:d.id,nrDzialu:d.nr,dzTytul:d.tytul,kat:k.nazwa,front:frontZ(p),back:backZ(p)});});});});

  else h+='<div class="f-a">'+f.back+'</div><button type="button" class="btn btn-reveal" data-f="next">Następna →</button>';
  h+='<div class="f-prog"><span>Fiszka '+(fidx+1)+' z '+fdeck.length+'</span><div class="bar"><i style="width:'+proc+'%"></i></div></div>';

}

/* ---------- logika kart ---------- */
function cardOf(p){return document.getElementById('q'+p.nr);}
function isOpen(card){return !card.querySelector('.answer').hidden;}
function getSeq(card){return card.dataset.seq?card.dataset.seq.split(',').map(Number):[];}
function renderSeq(card,p){card.querySelector('.oseq').innerHTML=getSeq(card).map(function(i,n){return '<span><em>'+(n+1)+'.</em>'+p.elementy[i]+'</span>';}).join('');}
function clearOrder(card,p){card.dataset.seq='';card.querySelectorAll('.ochip').forEach(function(b){b.disabled=false;});renderSeq(card,p);if(isOpen(card))evaluate(card,p);}

function scoreMsg(h,n,what){
  if(h===n)return '🎯 Bezbłędnie! '+what+': '+h+' z '+n+'.';
  return '🔎 '+what+': '+h+' z '+n+'. Porównaj z odpowiedzią poniżej.';
}
function evaluate(card,p){
  var sc=card.querySelector('.score'),msg='';
  if(p.typ==='dopasuj'){
    var hit=0,tried=0;
    card.querySelectorAll('.ml li').forEach(function(li,i){var v=li.querySelector('select').value;li.classList.remove('right','wrong');if(!v)return;tried++;if(v===p.klucz[i]){hit++;li.classList.add('right');}else li.classList.add('wrong');});
    if(tried)msg=scoreMsg(hit,p.klucz.length,'Dobrze dopasowane');
  }else if(p.typ==='pf'){
    var h2=0,t2=0;
    card.querySelectorAll('.pf li').forEach(function(li,i){var s=li.querySelector('button.sel');li.classList.remove('right','wrong');if(!s)return;t2++;if((s.dataset.v==='P')===p.zdania[i].p){h2++;li.classList.add('right');}else li.classList.add('wrong');});
    if(t2)msg=scoreMsg(h2,p.zdania.length,'Dobre odpowiedzi');
  }else if(p.typ==='kolejnosc'){
    var seq=getSeq(card);
    if(seq.length){var h3=0;seq.forEach(function(v,i){if(v===p.kolejnosc[i])h3++;});msg=scoreMsg(h3,p.kolejnosc.length,'Na właściwym miejscu');}
  }else if(p.typ==='sortuj'){
    var h4=0,t4=0;
    card.querySelectorAll('.sort li').forEach(function(li,i){var s=li.querySelector('button.sel');li.classList.remove('right','wrong');if(!s)return;t4++;if(+s.getAttribute('data-k')===p.elementy[i].k){h4++;li.classList.add('right');}else li.classList.add('wrong');});
    if(t4)msg=scoreMsg(h4,p.elementy.length,'Dobrze przyporządkowane');
  }
  sc.classList.toggle('hide',!msg);sc.textContent=msg;
}
function toggle(card,p){
  var a=card.querySelector('.answer'),b=card.querySelector('.btn-reveal'),open=a.hidden;
  a.hidden=!open;b.setAttribute('aria-expanded',String(open));
  b.textContent=open?'🙈 Schowaj odpowiedź':'👀 Pokaż odpowiedź';
  if(open)evaluate(card,p);
  else card.querySelectorAll('li.right,li.wrong').forEach(function(li){li.classList.remove('right','wrong');});
}
function paintCard(card,p){
  var m=store[p.uid];
  card.classList.toggle('is-ok',m==='ok');card.classList.toggle('is-rep',m==='rep');
  card.querySelector('.qmark').textContent=m==='ok'?'✅ Umiem':m==='rep'?'🔁 Do powtórki':'';
  card.querySelector('.btn-ok').classList.toggle('on',m==='ok');
  card.querySelector('.btn-rep').classList.toggle('on',m==='rep');
}
function countOk(list){return (list||ALL).filter(function(p){return store[p.uid]==='ok';}).length;}
function catDone(k){return countOk(k.pytania)===k.pytania.length;}

function rankFor(f){var list=curRangi(),r=list[0];list.forEach(function(x){if(f>=x.od)r=x;});return r;}
function refresh(){
  var ok=countOk(),f=ok/TOTAL,r=rankFor(f);
  $('#pcount').textContent='Umiem: '+ok+' / '+TOTAL;
  $('#barfill').style.width=(f*100)+'%';
  $('#bar').setAttribute('aria-valuenow',ok);
  $('#rank').textContent=r.e+' '+r.n;
  dz.kategorie.forEach(function(k){
    var c=countOk(k.pytania),n=k.pytania.length;
    var chip=document.querySelector('[data-chip="'+k.id+'"]');
    chip.querySelector('small').textContent=c+'/'+n;
    chip.classList.toggle('done',c===n);
    document.querySelector('[data-cnt="'+k.id+'"]').textContent=(c===n?'🌟 ':'')+'Umiem '+c+' z '+n;
  });
}

var repOnly=false;
function applyFilter(){
  ALL.forEach(function(p){cardOf(p).classList.toggle('hide',repOnly&&store[p.uid]!=='rep');});
  document.querySelectorAll('.cat').forEach(function(s){s.classList.toggle('hide',repOnly&&!s.querySelector('.card:not(.hide)'));});
}
function setRepOnly(v){repOnly=v;$('#t-rep').setAttribute('aria-pressed',String(v));applyFilter();}

function setMark(card,p,m){
  var wasCat=catDone(p.k),wasAll=countOk()===TOTAL;
  if(store[p.uid]===m)delete store[p.uid];else store[p.uid]=m;
  save();paintCard(card,p);refresh();
  if(store[p.uid]==='ok'){
    if(countOk()===TOTAL&&!wasAll){celebrate();toast('🏆 Cały dział opanowany! Zostajesz: '+curRangi()[curRangi().length-1].n+'!');}
    else if(catDone(p.k)&&!wasCat){toast('🌟 Kategoria „'+p.k.nazwa+'” zaliczona!');}
    else toast(pick(POCHWALY));
  }else if(store[p.uid]==='rep')toast(pick(DOPING));
  if(repOnly){
    if(!ALL.some(function(x){return store[x.uid]==='rep';})){setRepOnly(false);toast('Wszystkie powtórki zrobione! 🎉');}
    else applyFilter();
  }
}

$('#main').addEventListener('click',function(e){

  if(fb){var fn=+fb.getAttribute('data-fiszki');try{if(location.hash!=='#fiszki-r'+fn)location.hash='#fiszki-r'+fn;}catch(err){}if(fn===1)renderFiszki();else renderFsoon(fn);window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});return;}
  var fz=e.target.closest('[data-f]');
  if(fz){fAkcja(fz.getAttribute('data-f'));return;}
  var nb=e.target.closest('[data-nav]');
  if(nb){var nv=nb.getAttribute('data-nav');if(nv==='klasy')goHist('klasy','historia');else if(nv==='ksiazki')goHist('ksiazki','klasa5');else if(nv==='rozdzialy')goHist('rozdzialy','podrecznik-h5');return;}
  var rb=e.target.closest('[data-r]');
  if(rb){var n=+rb.getAttribute('data-r');try{if(location.hash!=='#r'+n)location.hash='#r'+n;}catch(err){}if(n===1){view='dzial';render(dz?dz.id:unlocked()[0].id);}else renderSoonChapter(n);window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});return;}
  var card=e.target.closest('.card');if(!card)return;
  var p=BY[card.dataset.uid];
  if(e.target.closest('.btn-reveal'))return toggle(card,p);
  if(e.target.closest('.btn-ok'))return setMark(card,p,'ok');
  if(e.target.closest('.btn-rep'))return setMark(card,p,'rep');
  var pb=e.target.closest('.pfb button');
  if(pb){pb.parentNode.querySelectorAll('button').forEach(function(b){var on=b===pb;b.classList.toggle('sel',on);b.setAttribute('aria-pressed',String(on));});if(isOpen(card))evaluate(card,p);return;}
  var sb=e.target.closest('.sortb button');
  if(sb){sb.parentNode.querySelectorAll('button').forEach(function(b){var on=b===sb;b.classList.toggle('sel',on);b.setAttribute('aria-pressed',String(on));});if(isOpen(card))evaluate(card,p);return;}
  var oc=e.target.closest('.ochip');
  if(oc){var s=getSeq(card);s.push(+oc.dataset.i);card.dataset.seq=s.join(',');oc.disabled=true;renderSeq(card,p);if(isOpen(card))evaluate(card,p);return;}
  if(e.target.closest('.oclear'))clearOrder(card,p);
});

  var id=(location.hash||'').replace('#','');
  if(!id)return false;
  if(SUBJECTS.some(function(s){return s.id===id;})){
    if(id!==subject)goSubject(id,false);
    else if(id==='historia')goHist('klasy');
    return true;
  }
  if(id==='klasa5'){if(subject!=='historia'){subject='historia';saveSubject();}goHist('ksiazki');return true;}
  if(id==='podrecznik-h5'){if(subject!=='historia'){subject='historia';saveSubject();}goHist('rozdzialy');return true;}
  var rm=id.match(/^r([1-8])$/);
  if(rm){if(subject!=='historia'){subject='historia';saveSubject();}var n=+rm[1];if(n===1){view='dzial';render(dz?dz.id:unlocked()[0].id);}else renderSoonChapter(n);return true;}
  var fm=id.match(/^fiszki-r([1-8])$/);
  if(fm){if(subject!=='historia'){subject='historia';saveSubject();}var fn=+fm[1];if(fn===1)renderFiszki();else renderFsoon(fn);return true;}
  if(getDz(id).id===id){if(subject!=='historia'){subject='historia';saveSubject();}view='dzial';render(id);return true;}
  return false;
}
window.addEventListener('hashchange',function(){routeFromHash();});

$('#t-random').addEventListener('click',function(){
  var pool=ALL.filter(function(p){return store[p.uid]!=='ok'&&!cardOf(p).classList.contains('hide');});
  if(!pool.length){toast('Umiesz wszystko! 🏆 Kliknij „Zacznij od nowa”, żeby sprawdzić się jeszcze raz.');return;}
  var c=cardOf(pick(pool));
  c.scrollIntoView({behavior:reduced?'auto':'smooth',block:'center'});
  c.classList.remove('pulse');void c.offsetWidth;c.classList.add('pulse');
});
$('#t-rep').addEventListener('click',function(){
  if(!repOnly&&!ALL.some(function(p){return store[p.uid]==='rep';})){toast('Nie masz jeszcze pytań do powtórki. Tak trzymaj! 👍');return;}
  setRepOnly(!repOnly);
  if(repOnly){var n=ALL.filter(function(p){return store[p.uid]==='rep';}).length;toast('Pokazuję '+n+' '+plural(n,'pytanie','pytania','pytań')+' do powtórki 🔁');}
});
$('#t-reset').addEventListener('click',function(){
  if(!confirm('Zacząć od nowa? Oceny „Umiem” i „Muszę powtórzyć” w tym dziale zostaną wyczyszczone.'))return;
  ALL.forEach(function(p){
    delete store[p.uid];
    var c=cardOf(p);
    if(isOpen(c))toggle(c,p);
    c.querySelectorAll('select').forEach(function(s){s.value='';});
    c.querySelectorAll('.pfb button').forEach(function(b){b.classList.remove('sel');b.setAttribute('aria-pressed','false');});
    c.querySelectorAll('.sortb button').forEach(function(b){b.classList.remove('sel');b.setAttribute('aria-pressed','false');});
    if(p.typ==='kolejnosc')clearOrder(c,p);
    paintCard(c,p);
  });
  save();setRepOnly(false);refresh();
  window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});
  toast('Czysta karta! Ruszamy od początku 🚀');
});

var toastT;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2400);}
function celebrate(){
  if(reduced)return;
  var cols=['#FF6B5B','#FFB938','#14A39F','#7C5CFF','#3B82F6','#16A063','#E8579B'];
  for(var i=0;i<110;i++){
    var d=document.createElement('i');d.className='confetti';
    d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];
    d.style.setProperty('--dx',(Math.random()*160-80)+'px');d.style.setProperty('--rot',(Math.random()*900-450)+'deg');
    d.style.animationDuration=(2.4+Math.random()*2)+'s';d.style.animationDelay=(Math.random()*.6)+'s';
    document.body.appendChild(d);
    (function(el){setTimeout(function(){el.remove();},5600);})(d);
  }
}

(function init(){
  var id=(location.hash||'').replace('#','');
  if(id&&SUBJECTS.some(function(s){return s.id===id;})){goSubject(id,false);return;}
  if(id==='klasa5'){subject='historia';saveSubject();goHist('ksiazki');return;}
  if(id==='podrecznik-h5'){subject='historia';saveSubject();goHist('rozdzialy');return;}
  var rm=id.match(/^r([1-8])$/);
  if(rm){subject='historia';saveSubject();var n=+rm[1];if(n===1){view='dzial';render(unlocked()[0].id);}else renderSoonChapter(n);return;}
  var fm=id.match(/^fiszki-r([1-8])$/);
  if(fm){subject='historia';saveSubject();var fn=+fm[1];if(fn===1)renderFiszki();else renderFsoon(fn);return;}
  if(id&&getDz(id).id===id){subject='historia';saveSubject();view='dzial';render(id);return;}
  if(subject!=='historia'){renderSoon();return;}
  view='klasy';renderKlasy();
})();
})();
</script>
